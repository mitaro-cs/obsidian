name: 🛒 Заказать хранилище
description: Хранилище Obsidian под ключ — 3 000 ₽
title: "Заказ: "
body:
  - type: markdown
    attributes:
      value: |
        Заполни форму — отвечу в комментариях и пришлю реквизиты для оплаты.
        **Issues видны всем**: не указывай телефон и другие личные данные. Для личного — Telegram [@treadways](https://t.me/treadways).

  - type: checkboxes
    id: services
    attributes:
      label: Что заказываешь
      options:
        - label: Хранилище под ключ — 3 000 ₽
        - label: Кинотека — по запросу
        - label: Плагин на заказ — 1 500–5 000 ₽

  - type: textarea
    id: plugin
    attributes:
      label: Если нужен плагин — что он должен делать
      placeholder: "Например: кнопка, которая создаёт заметку фильма по ссылке"

  - type: checkboxes
    id: devices
    attributes:
      label: Устройства
      options:
        - label: Windows
        - label: macOS
        - label: Linux
        - label: Android
        - label: iOS

  - type: input
    id: telegram
    attributes:
      label: Telegram для связи
      description: Необязательно — можно общаться прямо здесь.
      placeholder: "@username"

  - type: checkboxes
    id: confirm
    attributes:
      label: Подтверждение
      options:
        - label: Понимаю, что хранилище передаётся без заметок автора, а опции оплачиваются отдельно
          required: true
