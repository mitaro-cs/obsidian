<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <title>Главная страница хранилища (макет)</title>
  <style>
    text { font-family: Segoe UI, Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
    .nav  { font-size: 13px; fill: #bdbdbd; }
    .lbl  { font-size: 11px; fill: #6f6f6f; letter-spacing: 1.5px; font-weight: 600; }
    .h3   { font-size: 15px; fill: #a88bfa; font-weight: 600; }
    .cell { font-size: 13px; fill: #d4d4d4; }
    .th   { font-size: 11px; fill: #7a7a7a; letter-spacing: 1px; font-weight: 600; }
    .tag  { font-size: 11px; fill: #c4b5fd; }
    .chev { fill: none; stroke: #7a7a7a; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <clipPath id="win"><rect width="900" height="540" rx="12"/></clipPath>
    <path id="right" class="chev" d="M0 0 L4 4 L0 8"/>
    <path id="down" class="chev" d="M0 0 L4 4 L8 0"/>
  </defs>

  <g clip-path="url(#win)">
    <rect width="900" height="540" fill="#1e1e1e"/>

    <!-- заголовок окна -->
    <rect width="900" height="36" fill="#161616"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="18" r="6" fill="#febc2e"/>
    <circle cx="60" cy="18" r="6" fill="#28c840"/>
    <text x="450" y="23" font-size="12" fill="#8a8a8a" text-anchor="middle">Home — Vault</text>

    <!-- боковая панель -->
    <rect y="36" width="220" height="480" fill="#252525"/>
    <text x="20" y="66" class="lbl">VAULT</text>

    <use href="#right" x="22" y="84"/><text x="36" y="92" class="nav">00 Inbox</text>
    <use href="#down"  x="20" y="112"/><text x="36" y="118" class="nav">10 Projects</text>
    <rect x="40" y="134" width="8" height="10" rx="1.5" fill="none" stroke="#6f6f6f"/><text x="56" y="144" class="nav">Диплом</text>
    <rect x="40" y="160" width="8" height="10" rx="1.5" fill="none" stroke="#6f6f6f"/><text x="56" y="170" class="nav">Портфолио</text>
    <use href="#right" x="22" y="188"/><text x="36" y="196" class="nav">20 Areas</text>
    <use href="#right" x="22" y="214"/><text x="36" y="222" class="nav">30 Resources</text>
    <use href="#right" x="22" y="240"/><text x="36" y="248" class="nav">40 Archive</text>
    <use href="#right" x="22" y="266"/><text x="36" y="274" class="nav">Daily</text>
    <use href="#right" x="22" y="292"/><text x="36" y="300" class="nav">Templates</text>
    <use href="#right" x="22" y="318"/><text x="36" y="326" class="nav">Attachments</text>

    <rect x="10" y="342" width="200" height="26" rx="6" fill="#7f6df2" fill-opacity=".28"/>
    <rect x="22" y="350" width="8" height="10" rx="1.5" fill="none" stroke="#c4b5fd"/>
    <text x="38" y="360" class="nav" style="fill:#fff">Home</text>
    <rect x="22" y="376" width="8" height="10" rx="1.5" fill="none" stroke="#6f6f6f"/>
    <text x="38" y="386" class="nav">Начни здесь</text>

    <!-- основная заметка -->
    <line x1="220" y1="36" x2="220" y2="516" stroke="#333"/>
    <text x="252" y="86" font-size="28" font-weight="700" fill="#f2f2f2">Home</text>
    <text x="252" y="110" font-size="13" fill="#8a8a8a">Сегодня · 3 задачи · 3 проекта в работе</text>
    <line x1="252" y1="126" x2="628" y2="126" stroke="#333"/>

    <text x="252" y="158" class="h3">Активные проекты</text>
    <text x="252" y="186" class="th">ПРОЕКТ</text>
    <text x="420" y="186" class="th">ПРОГРЕСС</text>
    <text x="628" y="186" class="th" text-anchor="end">ДЕДЛАЙН</text>
    <line x1="252" y1="196" x2="628" y2="196" stroke="#333"/>

    <text x="252" y="220" class="cell">Диплом</text>
    <rect x="420" y="211" width="110" height="6" rx="3" fill="#333"/><rect x="420" y="211" width="77" height="6" rx="3" fill="#7f6df2"/>
    <text x="628" y="220" class="cell" text-anchor="end">15.12</text>
    <line x1="252" y1="232" x2="628" y2="232" stroke="#2a2a2a"/>

    <text x="252" y="256" class="cell">Портфолио</text>
    <rect x="420" y="247" width="110" height="6" rx="3" fill="#333"/><rect x="420" y="247" width="44" height="6" rx="3" fill="#7f6df2"/>
    <text x="628" y="256" class="cell" text-anchor="end">01.11</text>
    <line x1="252" y1="268" x2="628" y2="268" stroke="#2a2a2a"/>

    <text x="252" y="292" class="cell">Курс по сетям</text>
    <rect x="420" y="283" width="110" height="6" rx="3" fill="#333"/><rect x="420" y="283" width="94" height="6" rx="3" fill="#7f6df2"/>
    <text x="628" y="292" class="cell" text-anchor="end">20.10</text>

    <text x="252" y="336" class="h3">Задачи на сегодня</text>

    <rect x="252" y="352" width="14" height="14" rx="3" fill="#7f6df2"/>
    <path d="M255.5 359 L258.5 362 L263 355.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="276" y="364" class="cell" style="fill:#707070" textLength="104" lengthAdjust="spacingAndGlyphs">Разобрать Inbox</text>
    <line x1="274" y1="359" x2="382" y2="359" stroke="#707070"/>

    <rect x="252.5" y="380.5" width="13" height="13" rx="3" fill="none" stroke="#7a7a7a"/>
    <text x="276" y="392" class="cell">Лаба: VLAN и trunk-порты</text>
    <rect x="582" y="379" width="46" height="18" rx="9" fill="#7f6df2" fill-opacity=".2"/>
    <text x="605" y="392" class="tag" text-anchor="middle">#сети</text>

    <rect x="252.5" y="408.5" width="13" height="13" rx="3" fill="none" stroke="#7a7a7a"/>
    <text x="276" y="420" class="cell">Прочитать главу 4</text>
    <rect x="574" y="407" width="54" height="18" rx="9" fill="#7f6df2" fill-opacity=".2"/>
    <text x="601" y="420" class="tag" text-anchor="middle">#учёба</text>

    <rect x="252" y="446" width="376" height="54" rx="6" fill="#7f6df2" fill-opacity=".12"/>
    <rect x="252" y="446" width="3" height="54" fill="#7f6df2"/>
    <text x="270" y="467" font-size="12" font-weight="700" fill="#a88bfa">Мысль дня</text>
    <text x="270" y="488" font-size="13" fill="#cfcfcf">Голова — для идей, а не для их хранения.</text>

    <!-- правая панель -->
    <rect x="660" y="36" width="240" height="480" fill="#222"/>
    <line x1="660" y1="36" x2="660" y2="516" stroke="#333"/>
    <text x="684" y="66" class="lbl">ГРАФ</text>

    <g stroke="#4a4a4a" stroke-width="1">
      <line x1="780" y1="170" x2="720" y2="112"/>
      <line x1="780" y1="170" x2="842" y2="104"/>
      <line x1="780" y1="170" x2="862" y2="190"/>
      <line x1="780" y1="170" x2="822" y2="252"/>
      <line x1="780" y1="170" x2="728" y2="240"/>
      <line x1="780" y1="170" x2="700" y2="176"/>
      <line x1="720" y1="112" x2="776" y2="92"/>
      <line x1="842" y1="104" x2="776" y2="92"/>
      <line x1="862" y1="190" x2="880" y2="140"/>
      <line x1="822" y1="252" x2="862" y2="190"/>
      <line x1="728" y1="240" x2="696" y2="262"/>
      <line x1="822" y1="252" x2="790" y2="275"/>
      <line x1="700" y1="176" x2="728" y2="240"/>
    </g>
    <g fill="#8a8a8a">
      <circle cx="720" cy="112" r="5"/>
      <circle cx="842" cy="104" r="5"/>
      <circle cx="862" cy="190" r="6"/>
      <circle cx="822" cy="252" r="5"/>
      <circle cx="728" cy="240" r="5"/>
      <circle cx="700" cy="176" r="4"/>
      <circle cx="776" cy="92" r="3.5"/>
      <circle cx="880" cy="140" r="3.5"/>
      <circle cx="696" cy="262" r="3.5"/>
      <circle cx="790" cy="275" r="3.5"/>
    </g>
    <circle cx="780" cy="170" r="14" fill="#7f6df2" fill-opacity=".25"/>
    <circle cx="780" cy="170" r="8" fill="#a88bfa"/>

    <text x="684" y="318" class="lbl">АКТИВНОСТЬ</text>
    <g transform="translate(684 332)">
      <!-- 5 недель × 7 дней: количество заметок в день -->
      <g fill="#2e2e2e">
        <rect x="0"   y="0" width="18" height="18" rx="4"/>
        <rect x="72"  y="0" width="18" height="18" rx="4"/>
        <rect x="144" y="24" width="18" height="18" rx="4"/>
        <rect x="24"  y="48" width="18" height="18" rx="4"/>
        <rect x="120" y="72" width="18" height="18" rx="4"/>
        <rect x="0"   y="96" width="18" height="18" rx="4"/>
      </g>
      <g fill="#4b3f8f">
        <rect x="24"  y="0" width="18" height="18" rx="4"/>
        <rect x="120" y="0" width="18" height="18" rx="4"/>
        <rect x="0"   y="24" width="18" height="18" rx="4"/>
        <rect x="96"  y="24" width="18" height="18" rx="4"/>
        <rect x="72"  y="48" width="18" height="18" rx="4"/>
        <rect x="144" y="48" width="18" height="18" rx="4"/>
        <rect x="48"  y="72" width="18" height="18" rx="4"/>
        <rect x="24"  y="96" width="18" height="18" rx="4"/>
        <rect x="144" y="96" width="18" height="18" rx="4"/>
      </g>
      <g fill="#6a57c9">
        <rect x="48"  y="0" width="18" height="18" rx="4"/>
        <rect x="144" y="0" width="18" height="18" rx="4"/>
        <rect x="24"  y="24" width="18" height="18" rx="4"/>
        <rect x="120" y="24" width="18" height="18" rx="4"/>
        <rect x="0"   y="48" width="18" height="18" rx="4"/>
        <rect x="96"  y="48" width="18" height="18" rx="4"/>
        <rect x="0"   y="72" width="18" height="18" rx="4"/>
        <rect x="96"  y="72" width="18" height="18" rx="4"/>
        <rect x="72"  y="96" width="18" height="18" rx="4"/>
        <rect x="120" y="96" width="18" height="18" rx="4"/>
      </g>
      <g fill="#a88bfa">
        <rect x="96"  y="0" width="18" height="18" rx="4"/>
        <rect x="48"  y="24" width="18" height="18" rx="4"/>
        <rect x="72"  y="24" width="18" height="18" rx="4"/>
        <rect x="48"  y="48" width="18" height="18" rx="4"/>
        <rect x="120" y="48" width="18" height="18" rx="4"/>
        <rect x="24"  y="72" width="18" height="18" rx="4"/>
        <rect x="72"  y="72" width="18" height="18" rx="4"/>
        <rect x="144" y="72" width="18" height="18" rx="4"/>
        <rect x="48"  y="96" width="18" height="18" rx="4"/>
        <rect x="96"  y="96" width="18" height="18" rx="4"/>
      </g>
    </g>
    <text x="684" y="478" font-size="12" fill="#8a8a8a">Серия: 12 дней подряд</text>

    <!-- строка состояния -->
    <rect y="516" width="900" height="24" fill="#1a1a1a"/>
    <text x="884" y="532" font-size="11" fill="#6f6f6f" text-anchor="end">Git: синхронизировано · 247 слов · 12 ссылок</text>
  </g>
</svg>
